<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@leicam | Links</title>
    <!-- Importando ícones (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Link para o arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Avatar -->
        <div class="profile">
            <img src="https://avataaars.io/?avatarStyle=Transparent&topType=ShortHairShortFlat&accessoriesType=Prescription02&hairColor=BrownDark&facialHairType=Blank&clotheType=BlazerShirt&eyeType=Happy&eyebrowType=Default&mouthType=Smile&skinColor=Light" alt="Avatar do Leicam" class="avatar">
            <h1>@leicam</h1>
            <p>Lives diários sobre tecnologia, games e empreendedorismo.<br>Acompanhe-me para dicas e novidades!</p>
        </div>

        <!-- Ícones Sociais (Topo) -->
        <div class="social-icons-top">
            <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="#" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="#" target="_blank"><i class="fab fa-amazon"></i></a>
            <a href="#" target="_blank"><i class="fab fa-twitch"></i></a>
        </div>

        <!-- Botões de Link -->
        <div class="links">
            <!-- Twitch -->
            <a href="https://twitch.tv/leicamx" class="link-card" target="_blank">
                <div class="icon-left"><i class="fab fa-twitch"></i></div>
                <div class="text-center">
                    <span class="title">Twitch</span>
                    <span class="subtitle"><i class="fab fa-twitch"></i> Twitch · leicamx</span>
                </div>
                <div class="icon-right"><i class="fas fa-ellipsis-v"></i></div>
            </a>

            <!-- YouTube -->
            <a href="#" class="link-card" target="_blank">
                <div class="icon-left"><i class="fab fa-youtube"></i></div>
                <div class="text-center">
                    <span class="title">Youtube</span>
                </div>
                <div class="icon-right"><i class="fas fa-ellipsis-v"></i></div>
            </a>

            <!-- Kick -->
            <a href="#" class="link-card" target="_blank">
                <div class="icon-left"><i class="fas fa-k"></i></div> <!-- Ícone aproximado para Kick -->
                <div class="text-center">
                    <span class="title">Kick</span>
                </div>
                <div class="icon-right"><i class="fas fa-ellipsis-v"></i></div>
            </a>

            <!-- Instagram -->
            <a href="#" class="link-card" target="_blank">
                <div class="icon-left"><i class="fab fa-instagram"></i></div>
                <div class="text-center">
                    <span class="title">Instagram</span>
                </div>
                <div class="icon-right"><i class="fas fa-ellipsis-v"></i></div>
            </a>

            <!-- TikTok -->
            <a href="#" class="link-card" target="_blank">
                <div class="icon-left"><i class="fab fa-tiktok"></i></div>
                <div class="text-center">
                    <span class="title">TikTok</span>
                </div>
                <div class="icon-right"><i class="fas fa-ellipsis-v"></i></div>
            </a>

            <!-- Email -->
            <a href="mailto:seuemail@email.com" class="link-card">
                <div class="icon-left"><i class="fas fa-envelope"></i></div>
                <div class="text-center">
                    <span class="title">Email</span>
                </div>
                <div class="icon-right"><i class="fas fa-ellipsis-v"></i></div>
            </a>

            <!-- Donate -->
            <a href="#" class="link-card" target="_blank">
                <div class="icon-left"><i class="fas fa-gift"></i></div>
                <div class="text-center">
                    <span class="title">Faça um donate :)</span>
                </div>
                <div class="icon-right"><i class="fas fa-ellipsis-v"></i></div>
            </a>
        </div>
    </div>

</body>
</html>
